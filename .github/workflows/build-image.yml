name: Build and push challenge images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: 我的题目/2026日月盾/决赛/剪刀石头布
            image: rock-paper-scissors
          - dir: 我的题目/2026日月盾/初赛/急急国王
            image: jijiguowang
          - dir: 我的题目/2026日月盾/初赛/EZrandom
            image: ezrandom
          - dir: 我的题目/2026日月盾/初赛/EzJail
            image: ezjail
          - dir: 我的题目/2026日月盾/初赛/mmdd55
            image: mmdd55
          - dir: 我的题目/2026日月盾/初赛/无边的黑暗のRevenge
            image: wubiandeheian

    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Compute unique tag (short commit)
        run: echo "sha=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/pixelbc/${{ matrix.image }}:latest
            ghcr.io/pixelbc/${{ matrix.image }}:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
